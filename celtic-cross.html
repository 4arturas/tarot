<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celtic Cross Tarot Spread</title>
    <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>

    <script type="module">
        import React from "https://esm.sh/react@19?dev";
        import { createRoot } from "https://esm.sh/react-dom@19/client?dev";
        import { Button, Checkbox, Modal, Select, Space } from "https://esm.sh/antd@6.4.5?dev&bundle";

        globalThis.React = React;
        globalThis.ReactDOM = { createRoot };
        globalThis.antd = { Button, Checkbox, Modal, Select, Space };
    </script>

    <script type="text/javascript" src="images-smith-waite.js"></script>
    <script type="text/javascript" src="js/tarotNames.js"></script>
    <script type="text/javascript" src="js/tarotDecks.js"></script>

    <style>
        body { padding: 30px }
        img { width: 120px; }
        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 30px;
        }
        .cross-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-right: 50px;
        }
        .cross-row {
            display: flex;
            justify-content: center;
            position: relative;
        }
        .card-list {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 50px;
        }
        .card-list img { margin: 10px; }
        .rotated-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: rotate(60deg);
            margin-left: -40px;
            margin-top: -20px;
        }
        .card-3 { margin-bottom: 50px; }
        .card-4 { margin-top: 100px; }
        .card-5 { margin-right: 100px; }
        .card-6 { margin-left: 100px; }
        .verse {
            white-space: pre-line;
            font-style: italic;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState } = React;
    const { Button, Checkbox, Modal, Select, Space } = antd;

    const drawCards = () => {
        const deck = [...Array(78).keys()];
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        return deck.slice(0, 10);
    };

    const getCardImage = (index, deckIdx, useLocalImages) => {
        const [url, name] = tarotDecks[deckIdx];
        if (useLocalImages) {
            return `tarot_images/${name.replace(/ /g, '_')}/${index}.jpg`;
        }
        if (!url) {
            return arr1[index];
        }
        return url.replace('0.jpg', `${index}.jpg`);
    };

    // Fragments of eilerastis.txt, one per spread position (index 0 = position 1).
    const positionVerses = [
        'Первый скажет, что сейчас,\nЧто волнует в данный час.',
        'Двойка ляжет поперёк:\nЧто мешает, что не впрок.',
        'Тройку сверху расположим —\nЭто то, что мысль гложет.',
        'А четвёрку вниз кладём,\nЧувства мы по ней прочтём.',
        'Пятый слева нам расскажет,\nЧто прошло и что забыто.',
        'А шестой направо ляжет —\nЧто грядёт, пока что скрыто.',
        'Связан здесь аркан седьмой\nНепосредственно с тобой.',
        'Номер восемь — весь твой круг:\nКто твой недруг, кто твой друг.',
        'А в девятке два значенья —\nЧаянья и опасенья:\nКак надежда — в позитиве\nИ как страхи — в негативе.',
        'Вот десятка наконец,\nИ она всему венец:\nКак проблема разрешится,\nСтоит ли чего страшиться, —\nВсё расскажет кельтский крест:\nЧто ушло, придёт и есть.',
    ];

    function Card({ card, position, deckIdx, useLocalImages }) {
        const [open, setOpen] = useState(false);
        const title = `${card} - ${tarotNames[card]}`;
        const img = getCardImage(card, deckIdx, useLocalImages);
        return (
            <>
                <img src={img} alt={title} onClick={() => setOpen(true)} style={{ cursor: 'pointer' }} />
                <Modal title={`${position + 1}. ${title}`} open={open} onCancel={() => setOpen(false)} footer={null}>
                    <p className="verse">{positionVerses[position]}</p>
                    <img src={img} alt={title} style={{ width: '100%' }} />
                </Modal>
            </>
        );
    }

    function CelticCross({ cards, deckIdx, useLocalImages }) {
        const card = (i) => <Card card={cards[i]} position={i} deckIdx={deckIdx} useLocalImages={useLocalImages} />;
        return (
            <div className="container">
                <div className="cross-layout">
                    <div className="cross-row card-3">{card(2)}</div>
                    <div className="cross-row">
                        <div className="card-5">{card(4)}</div>
                        <div style={{ position: 'relative' }}>
                            {card(0)}
                            <div className="rotated-card">{card(1)}</div>
                        </div>
                        <div className="card-6">{card(5)}</div>
                    </div>
                    <div className="cross-row card-4">{card(3)}</div>
                </div>
                <div className="card-list">
                    {[6, 7, 8, 9].map(i => <div key={i}>{card(i)}</div>)}
                </div>
            </div>
        );
    }

    function App() {
        const [deckIdx, setDeckIdx] = useState(0);
        const [useLocalImages, setUseLocalImages] = useState(false);
        const [cards, setCards] = useState(drawCards);

        const deckOptions = tarotDecks.map((deck, idx) => ({ value: idx, label: deck[1] }));

        return (
            <div>
                <Space wrap>
                    <Checkbox checked={useLocalImages} onChange={(e) => setUseLocalImages(e.target.checked)}>
                        Use Local Images
                    </Checkbox>
                    <b>Decks:</b>
                    <Select
                        value={deckIdx}
                        options={deckOptions}
                        style={{ width: 260 }}
                        showSearch={{ optionFilterProp: 'label' }}
                        onChange={(value) => {
                            setDeckIdx(value);
                            setCards(drawCards());
                        }}
                    />
                    <Button type="primary" onClick={() => setCards(drawCards())}>Reshuffle</Button>
                </Space>
                <CelticCross cards={cards} deckIdx={deckIdx} useLocalImages={useLocalImages} />
            </div>
        );
    }

    const { createRoot } = ReactDOM;
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
